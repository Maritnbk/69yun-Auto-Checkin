name: Daily Checkin

# 触发条件
on:
  schedule:
    # 定时运行：北京时间每天 09:33（UTC 01:33）
    #
    # 注意：GitHub 托管 runner 的 schedule 事件是排队制，实测本项目历史运行延迟
    # 通过 API 触发 workflow_dispatch。
    - cron: '05 0 * * *'   # 北京时间 08:05
  workflow_dispatch:
    # 支持在 GitHub 界面手动点击 "Run workflow" 触发执行

# 最小权限：本工作流只需读取仓库内容
permissions:
  contents: read

# 同一时刻只允许一个签到任务运行，避免手动触发与定时触发撞车
concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 脚本内部有 240s 总预算（FLOW_BUDGET_MS），这里留出余量
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 语法检查
        run: node --check checkin.js

      - name: 执行签到脚本
        env:
          # 使用带 CHECKIN_ 前缀的变量名，避免与系统环境变量（如 USER）冲突。
          # 旧版 DOMAIN / USER / PASS 已废弃并从仓库中删除，不再兼容。
          CHECKIN_DOMAIN: ${{ secrets.CHECKIN_DOMAIN }}
          CHECKIN_USER: ${{ secrets.CHECKIN_USER }}
          CHECKIN_PASS: ${{ secrets.CHECKIN_PASS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: node checkin.js
